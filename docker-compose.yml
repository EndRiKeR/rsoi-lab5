version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    networks:
      - flight-booking-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  flight-service:
    build:
      context: .
      dockerfile: services/FlightService/Dockerfile
    container_name: flight-service
    environment:
      - DOCKER_CONNECT_STRING=Host=postgres;Port=5432;Database=flights;Username=postgres;Password=postgres
      - ASPNETCORE_HTTP_PORTS=8060
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-booking-network

  tickets-service:
    build:
      context: .
      dockerfile: services/TicketsService/Dockerfile
    container_name: tickets-service
    environment:
      - DOCKER_CONNECT_STRING=Host=postgres;Port=5432;Database=tickets;Username=postgres;Password=postgres
      - ASPNETCORE_HTTP_PORTS=8070
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-booking-network

  bonus-service:
    build:
      context: .
      dockerfile: services/BonusService/Dockerfile
    container_name: bonus-service
    environment:
      - DOCKER_CONNECT_STRING=Host=postgres;Port=5432;Database=privileges;Username=postgres;Password=postgres
      - ASPNETCORE_HTTP_PORTS=8050
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-booking-network
        
  identity-service:
    build:
      context: .
      dockerfile: services/IdentityService/Dockerfile
    container_name: identity-service
    environment:
      - DOCKER_CONNECT_STRING=Host=postgres;Port=5432;Database=identity;Username=postgres;Password=postgres
      - ASPNETCORE_HTTP_PORTS=8090
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-booking-network

  gateway-service:
    build:
      context: .
      dockerfile: services/GatewayService/Dockerfile
    container_name: gateway-service
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-booking-network
  
  statistic-service:
    build:
      context: .
      dockerfile: services/StatisticService/Dockerfile
    container_name: statistic-service
    environment:
      - DOCKER_CONNECT_STRING=Host=postgres;Port=5432;Database=statistics;Username=postgres;Password=postgres
      - ASPNETCORE_HTTP_PORTS=8100
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flight-booking-network

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CLUSTER_ID: "rsoi-cluster-001"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready 1 10 -b kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - flight-booking-network

volumes:
  postgres_data:

networks:
  flight-booking-network:
    driver: bridge