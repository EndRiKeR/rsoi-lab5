openapi: 3.0.1
info:
  title: Flight Booking System – Full API
  version: "1.2"
servers:
  - url: http://localhost:8080
    description: Gateway (основной вход)
  - url: http://localhost:8090
    description: Identity Service (OIDC)
paths:
  /api/v1/authorize:
    post:
      summary: Получить токен доступа (password flow)
      tags:
        - Gateway – Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Токен успешно получен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Неверные учётные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: Перенаправление на страницу логина (Authorization Code Flow)
      tags:
        - Gateway – Auth
      security: []
      responses:
        "302":
          description: Редирект на /connect/authorize Identity Service

  /api/v1/callback:
    get:
      summary: Обработка ответа после логина (Authorization Code Flow)
      tags:
        - Gateway – Auth
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Авторизационный код
      responses:
        "200":
          description: Токен успешно получен и возвращён в JSON или редирект на SPA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Ошибка обмена кода на токен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Gateway – Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterModel"
      responses:
        "200":
          description: Пользователь успешно зарегистрирован
        "400":
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Пользователь уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/flights:
    get:
      summary: Получить список рейсов
      tags:
        - Gateway – Flights
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Список рейсов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginationResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tickets:
    get:
      summary: Информация по всем билетам пользователя
      tags:
        - Gateway – Tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список билетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TicketResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Покупка билета
      tags:
        - Gateway – Tickets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketPurchaseRequest"
      responses:
        "200":
          description: Информация о купленном билете
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPurchaseResponse"
        "400":
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Нет доступных мест
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  "/api/v1/tickets/{ticketUid}":
    get:
      summary: Информация по конкретному билету
      tags:
        - Gateway – Tickets
      security:
        - bearerAuth: []
      parameters:
        - name: ticketUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Информация о билете
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Билет не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Возврат билета
      tags:
        - Gateway – Tickets
      security:
        - bearerAuth: []
      parameters:
        - name: ticketUid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Билет успешно возвращён
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Билет не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me:
    get:
      summary: Информация о пользователе
      tags:
        - Gateway – Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Полная информация о пользователе
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/privilege:
    get:
      summary: Получить информацию о состоянии бонусного счета
      tags:
        - Gateway – Privilege
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные о бонусном счете
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivilegeInfoResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/privilege/update-balance:
    post:
      summary: Обновить баланс бонусного счёта (внутренний)
      tags:
        - Gateway – Privilege
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBalanceHistoryRequest"
      responses:
        "200":
          description: Баланс обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivilegeInfoResponse"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/statistics:
    get:
      summary: Получить статистику событий (только для администратора)
      tags:
        - Gateway – Admin
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Список событий статистики
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticEvent"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав (требуется роль Admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/authorize:
    get:
      summary: Страница входа (Authorization Code Flow)
      tags:
        - Identity – OIDC
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: scope
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML-форма логина
          content:
            text/html: {}
    post:
      summary: Обработка логина (Authorization Code Flow)
      tags:
        - Identity – OIDC
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "302":
          description: Редирект с авторизационным кодом
        "401":
          description: Неверные учётные данные

  /connect/token:
    post:
      summary: Получение токена (OAuth2 Token Endpoint)
      tags:
        - Identity – OIDC
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, password]
                code:
                  type: string
                  description: требуется для authorization_code
                redirect_uri:
                  type: string
                  description: требуется для authorization_code
                username:
                  type: string
                  description: требуется для password
                password:
                  type: string
                  description: требуется для password
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
      responses:
        "200":
          description: Токен успешно выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Ошибка запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connect/userinfo:
    get:
      summary: Информация о текущем пользователе (OpenID Connect UserInfo)
      tags:
        - Identity – OIDC
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Данные пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                  preferred_username:
                    type: string
                  email:
                    type: string

  /api/accounts/register:
    post:
      summary: Регистрация пользователя (Identity Service напрямую)
      tags:
        - Identity – Accounts
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterModel"
      responses:
        "200":
          description: Пользователь зарегистрирован
        "400":
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/accounts/create-admin:
    post:
      summary: Создать администратора (только для существующих админов)
      tags:
        - Identity – Accounts
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterModel"
      responses:
        "200":
          description: Администратор создан
        "400":
          description: Ошибка валидации данных
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/statistics-direct:
    get:
      summary: Получить статистику событий напрямую из Statistic Service (только Admin)
      tags:
        - Statistic – Direct
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Список событий статистики
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatisticEvent"
        "401":
          description: Ошибка авторизации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Недостаточно прав
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /manage/health:
    get:
      summary: Health check (общий для всех сервисов)
      tags:
        - Health
      security: []
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
        scope:
          type: string

    RegisterModel:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
          format: email

    StatisticEvent:
      type: object
      properties:
        eventType:
          type: string
        timestamp:
          type: string
          format: date-time
        username:
          type: string
        payload:
          type: string

    UpdateBalanceHistoryRequest:
      type: object
      required: [ticketUid, balanceDiff, operationType]
      properties:
        ticketUid:
          type: string
          format: uuid
        balanceDiff:
          type: integer
        operationType:
          type: string
          enum: [FILL_IN_BALANCE, DEBIT_THE_ACCOUNT]

    PaginationResponse:
      type: object
      properties:
        page:
          type: number
        pageSize:
          type: number
        totalElements:
          type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/FlightResponse"

    FlightResponse:
      type: object
      properties:
        flightNumber:
          type: string
        fromAirport:
          type: string
        toAirport:
          type: string
        date:
          type: string
        price:
          type: number

    TicketResponse:
      type: object
      properties:
        ticketUid:
          type: string
          format: uuid
        flightNumber:
          type: string
        fromAirport:
          type: string
        toAirport:
          type: string
        date:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [PAID, CANCELED]

    UserInfoResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: "#/components/schemas/TicketResponse"
        privilege:
          $ref: "#/components/schemas/PrivilegeShortInfo"

    PrivilegeShortInfo:
      type: object
      properties:
        balance:
          type: string
        status:
          type: string
          enum: [BRONZE, SILVER, GOLD]

    PrivilegeInfoResponse:
      type: object
      properties:
        balance:
          type: string
        status:
          type: string
          enum: [BRONZE, SILVER, GOLD]
        history:
          type: array
          items:
            $ref: "#/components/schemas/BalanceHistory"

    BalanceHistory:
      type: object
      properties:
        date:
          type: string
        balanceDiff:
          type: string
        ticketUid:
          type: string
        operationType:
          type: string
          enum: [FILL_IN_BALANCE, DEBIT_THE_ACCOUNT, FILLED_BY_MONEY]

    TicketPurchaseRequest:
      type: object
      properties:
        flightNumber:
          type: string
        price:
          type: number
        paidFromBalance:
          type: boolean

    TicketPurchaseResponse:
      type: object
      properties:
        ticketUid:
          type: string
          format: uuid
        flightNumber:
          type: string
        fromAirport:
          type: string
        toAirport:
          type: string
        date:
          type: string
        status:
          type: string
        price:
          type: number
        paidByMoney:
          type: number
        paidByBonuses:
          type: number
        privilege:
          $ref: "#/components/schemas/PrivilegeShortInfo"

    ErrorDescription:
      type: object
      properties:
        field:
          type: string
        error:
          type: string

    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDescription"