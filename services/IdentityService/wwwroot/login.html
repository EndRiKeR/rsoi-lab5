<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'/>
    <title>Вход в систему</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .login-card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
        h1 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class='login-card'>
    <h1>Вход</h1>
    <div id="error-message" class="error"></div>
    <form method='post'>
        <input name='username' placeholder='Логин' required />
        <input name='password' type='password' placeholder='Пароль' required />
        <button type='submit'>Войти</button>
    </form>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    if (error === 'invalid_credentials') {
        document.getElementById('error-message').textContent = 'Неверный логин или пароль';
    }
</script>
</body>
</html>
