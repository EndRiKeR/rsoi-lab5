name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-images:
    name: Send images to Yandex Container Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Build and push images
        timeout-minutes: 15
        run: |
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/gateway-service:latest -f ./services/GatewayService/Dockerfile .
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/tickets-service:latest -f ./services/TicketsService/Dockerfile .
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/bonus-service:latest -f ./services/BonusService/Dockerfile .
          docker build -t cr.yandex/${{ secrets.YC_CR_ID }}/flight-service:latest -f ./services/FlightService/Dockerfile .

          docker push cr.yandex/${{ secrets.YC_CR_ID }}/gateway-service:latest
          docker push cr.yandex/${{ secrets.YC_CR_ID }}/tickets-service:latest
          docker push cr.yandex/${{ secrets.YC_CR_ID }}/bonus-service:latest
          docker push cr.yandex/${{ secrets.YC_CR_ID }}/flight-service:latest
  
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Setup and Deploy to Yandex Cloud
        run: |
          echo "|"
          echo "|"
          echo "=== Installing Yandex Cloud CLI ==="
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          export PATH="/home/runner/yandex-cloud/bin:$PATH"

          echo "|"
          echo "|"
          echo "=== Installing kubectl ==="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          echo "|"
          echo "|"
          echo "=== Installing Helm ==="
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          echo "|"
          echo "|"
          echo "=== Deploying Keycloak ==="
          
          kubectl create namespace keycloak
          
          helm repo add keycloak https://benc-uk.github.io/keycloak-helm
          helm repo update keycloak
          
          helm upgrade mykeycloak keycloak/keycloak --install \
            --namespace keycloak
            -f ./charts/keycloak/values.yaml
            --set keycloak.username=admin \
            --set keycloak.password=admin

          echo "|"
          echo "|"
          echo "=== Configuring YC CLI ==="
          yc config set token "${{ secrets.YC_OAUTH_TOKEN }}"
          yc config set folder-id "b1g1ok9v2ph2i9k05bot"
          yc container registry configure-docker

          echo "|"
          echo "|"
          echo "=== Getting kubeconfig ==="
          yc managed-kubernetes cluster get-credentials rsoi-kuber --external

          echo "|"
          echo "|"
          echo "=== Deploying Postgres ==="
          helm upgrade postgres ./charts/postgres --install \
            -n test \
            -f ./charts/postgres/values.yaml
          
          kubectl apply -f ./charts/postgres/templates/config-map.yaml -n test

          echo "|"
          echo "|"
          echo "=== Deploying application ==="
          helm upgrade gateway-service ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/gateway-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}}/gateway-service \
            --set image.tag=latest

          helm upgrade tickets-service ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/tickets-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}}/tickets-service \
            --set image.tag=latest

          helm upgrade flight-service ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/flight-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}}/flight-service \
            --set image.tag=latest

          helm upgrade bonus-service ./charts/services --install \
            --namespace test \
            -f ./charts/services/service-values/bonus-values.yaml \
            --set image.repository=cr.yandex/${{secrets.YC_CR_ID}}/bonus-service \
            --set image.tag=latest

          echo "|"
          echo "|"
          echo "=== Waiting for services ==="
          kubectl wait -n test -l app.kubernetes.io/instance=bonus-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/instance=flight-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/instance=tickets-service pod --for=condition=Ready --timeout=180s
          kubectl wait -n test -l app.kubernetes.io/instance=gateway-service pod --for=condition=Ready --timeout=180s
  
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Installing kubectl
        run: |
          echo "|"
          echo "|"
          echo "=== Installing Yandex Cloud CLI ==="
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          export PATH="/home/runner/yandex-cloud/bin:$PATH"

          echo "|"
          echo "|"
          echo "=== Installing kubectl ==="
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          echo "|"
          echo "|"
          echo "=== Installing Helm ==="
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

          echo "|"
          echo "|"
          echo "=== Configuring YC CLI ==="
          yc config set token "${{ secrets.YC_OAUTH_TOKEN }}"
          yc config set folder-id "b1g1ok9v2ph2i9k05bot"
          yc container registry configure-docker

          echo "|"
          echo "|"
          echo "=== Getting kubeconfig ==="
          yc managed-kubernetes cluster get-credentials rsoi-kuber --external

      - name: Start port-forward to gateway
        run: |
          nohup kubectl port-forward service/gateway-service -n test 8080:8080 > port-forward.log 2>&1 &
          echo $! > port-forward.pid
          for i in $(seq 1 30); do
            if nc -z localhost 8080; then
              echo "Port-forward is ready."
              exit 0
            fi
            if ! kill -0 $(cat port-forward.pid) 2>/dev/null; then
              echo "Port-forward process exited unexpectedly."
              cat port-forward.log
              exit 1
            fi
            sleep 1
          done
          echo "Port-forward did not become ready in time."
          cat port-forward.log
          exit 1

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: v1/postman/collection.json
          environment: v1/postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: false

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f port-forward.pid ]; then
            kill $(cat port-forward.pid) >/dev/null 2>&1 || true
            rm -f port-forward.pid
          fi
          if [ -f port-forward.log ]; then
            echo "Port-forward log:"
            cat port-forward.log
            rm -f port-forward.log
          fi