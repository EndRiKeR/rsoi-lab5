fullnameOverride: identity-service

image:
  repository: identity-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8443

env:
  - name: DOCKER_CONNECT_STRING
    value: "Host=postgres;Port=5432;Database=identity;Username=postgres;Password=postgres"

livenessProbe:
  httpGet:
    path: /manage/health
    port: 8443
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3


readinessProbe:
  httpGet:
    path: /manage/health
    port: 8443
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3


volumes:
  - name: identity-tls
    secret:
      secretName: identity-tls-secret

volumeMounts:
  - name: identity-tls
    mountPath: /etc/identity-tls
    readOnly: true